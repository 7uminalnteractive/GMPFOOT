name: Atualizar dados (teams.json)

on:
  schedule:
    - cron: "0 6 * * 1"   # toda segunda, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Opcional: defina a variável DATA_CSV_URL (Settings > Variables) apontando para a SUA fonte de dados.
      - name: Baixar CSV da sua fonte
        if: ${{ vars.DATA_CSV_URL != '' }}
        run: curl -fsSL "${{ vars.DATA_CSV_URL }}" -o data/players.csv
      - name: Gerar teams.json
        run: python scripts/build_teams_json.py data/players.csv data/teams.json
      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/teams.json data/players.csv
          git diff --cached --quiet || (git commit -m "chore: atualizar dados" && git push)
